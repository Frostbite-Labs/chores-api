                    type: string
                    enum:
                      - ok
                      - slow
                      - down
                  elapsedMs:
                    type: integer
                  error:
                    type: string
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
      operationId: getHealthz
