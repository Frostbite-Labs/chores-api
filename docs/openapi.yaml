openapi: 3.0.3
info:
  title: Chore Club API
  description: >-
    Multi-user, multi-household, multi-device chore tracker. RFC 7807 errors, `If-Match` optimistic concurrency on
    aggregate roots, `Idempotency-Key` on side-effecting hot-path POSTs, and a delta-sync protocol on `/sync`.
    Authoritative spec: `docs/api-spec.md`.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Local docker-compose stack.
  - url: https://chore-app-api.frostbitelabs.net
    description: Production.
tags:
  - name: health
    description: Liveness + dependency probe.
  - name: auth
    description: Sign-in (Google / Apple), refresh rotation, logout, account closure.
  - name: me
    description: Authenticated user profile + memberships.
  - name: households
    description: Household aggregate root.
  - name: members
    description: Household members (account-backed and standalone).
  - name: invites
    description: Invite codes and redemption.
  - name: tasks
    description: Task CRUD.
  - name: completions
    description: Completion log (append-only on the hot path).
  - name: leaderboard
    description: Monthly scoring.
  - name: sync
    description: Pull-delta + push-batch sync protocol.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token issued by `/v1/auth/google` or `/v1/auth/apple`. 15-min TTL.
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 string.
    IsoTimestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC, ms precision.
    RowVersion:
      type: integer
      minimum: 0
      description: Optimistic concurrency token (BIGINT UNSIGNED).
    ProblemDetails:
      type: object
      description: RFC 7807 problem+json body. Returned for every error.
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable code, e.g. `household.not_a_member`.
        errors:
          description: Optional structured payload (validation issues, conflict snapshot, etc.).
    User:
      type: object
      required:
        - id
        - email
        - emailVerified
        - displayName
        - avatar
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
          nullable: true
        emailVerified:
          type: boolean
        displayName:
          type: string
          maxLength: 80
        avatar:
          type: string
          maxLength: 16
        createdAt:
          $ref: '#/components/schemas/IsoTimestamp'
        updatedAt:
          $ref: '#/components/schemas/IsoTimestamp'
    MeResponse:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - linkedProviders
          properties:
            linkedProviders:
              type: array
              items:
                type: string
                enum:
                  - google
                  - apple
    HouseholdRole:
      type: string
      enum:
        - adult
        - child
    HouseholdPermission:
      type: string
      enum:
        - owner
        - admin
        - member
    TaskAudience:
      type: string
      enum:
        - adults
        - children
        - everyone
    RecurrencePreset:
      type: string
      enum:
        - hourly
        - daily
        - weekly
        - monthly
        - custom
    RecurrenceUnit:
      type: string
      enum:
        - hours
        - days
        - weeks
        - months
    RecurrenceRule:
      type: object
      required:
        - preset
        - unit
        - interval
      properties:
        preset:
          $ref: '#/components/schemas/RecurrencePreset'
        unit:
          $ref: '#/components/schemas/RecurrenceUnit'
        interval:
          type: integer
          minimum: 1
          maximum: 10000
    Household:
      type: object
      required:
        - id
        - name
        - ownerUserId
        - rowVersion
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 80
        ownerUserId:
          $ref: '#/components/schemas/Uuid'
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        createdAt:
          $ref: '#/components/schemas/IsoTimestamp'
        updatedAt:
          $ref: '#/components/schemas/IsoTimestamp'
    HouseholdMember:
      type: object
      required:
        - id
        - householdId
        - userId
        - role
        - permission
        - displayName
        - avatar
        - color
        - joinedAt
        - removedAt
        - rowVersion
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        householdId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
          nullable: true
          description: Null for standalone (non-account-backed) members.
        role:
          $ref: '#/components/schemas/HouseholdRole'
        permission:
          $ref: '#/components/schemas/HouseholdPermission'
        displayName:
          type: string
          maxLength: 80
        avatar:
          type: string
          maxLength: 16
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
        joinedAt:
          $ref: '#/components/schemas/IsoTimestamp'
        removedAt:
          $ref: '#/components/schemas/IsoTimestamp'
          nullable: true
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
    Task:
      type: object
      required:
        - id
        - householdId
        - title
        - icon
        - notes
        - audience
        - points
        - recurrence
        - nextDueAt
        - createdByUserId
        - rowVersion
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        householdId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 120
        icon:
          type: string
          maxLength: 16
        notes:
          type: string
          maxLength: 1000
          nullable: true
        audience:
          $ref: '#/components/schemas/TaskAudience'
        points:
          type: integer
          minimum: 0
          maximum: 1000000
        recurrence:
          $ref: '#/components/schemas/RecurrenceRule'
        nextDueAt:
          $ref: '#/components/schemas/IsoTimestamp'
        createdByUserId:
          $ref: '#/components/schemas/Uuid'
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        createdAt:
          $ref: '#/components/schemas/IsoTimestamp'
        updatedAt:
          $ref: '#/components/schemas/IsoTimestamp'
    TaskCompletion:
      type: object
      required:
        - id
        - householdId
        - taskId
        - memberId
        - completedByUserId
        - completedAt
        - pointsAwarded
        - taskTitleSnapshot
        - taskIconSnapshot
        - rowVersion
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        householdId:
          $ref: '#/components/schemas/Uuid'
        taskId:
          $ref: '#/components/schemas/Uuid'
        memberId:
          $ref: '#/components/schemas/Uuid'
        completedByUserId:
          $ref: '#/components/schemas/Uuid'
          nullable: true
        completedAt:
          $ref: '#/components/schemas/IsoTimestamp'
        pointsAwarded:
          type: integer
          minimum: 0
        taskTitleSnapshot:
          type: string
        taskIconSnapshot:
          type: string
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        createdAt:
          $ref: '#/components/schemas/IsoTimestamp'
    HouseholdInvite:
      type: object
      required:
        - id
        - householdId
        - invitedEmail
        - invitedRole
        - invitedPermission
        - createdByUserId
        - maxUses
        - usedCount
        - expiresAt
        - revokedAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        householdId:
          $ref: '#/components/schemas/Uuid'
        invitedEmail:
          type: string
          format: email
          nullable: true
        invitedRole:
          $ref: '#/components/schemas/HouseholdRole'
        invitedPermission:
          type: string
          enum:
            - admin
            - member
        createdByUserId:
          $ref: '#/components/schemas/Uuid'
        maxUses:
          type: integer
          minimum: 1
        usedCount:
          type: integer
          minimum: 0
        expiresAt:
          $ref: '#/components/schemas/IsoTimestamp'
        revokedAt:
          $ref: '#/components/schemas/IsoTimestamp'
          nullable: true
        createdAt:
          $ref: '#/components/schemas/IsoTimestamp'
    HouseholdInviteWithCode:
      type: object
      required:
        - invite
        - code
      properties:
        invite:
          $ref: '#/components/schemas/HouseholdInvite'
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: Plaintext invite code — returned exactly once at creation.
    InviteRedemption:
      type: object
      required:
        - household
        - member
      properties:
        household:
          $ref: '#/components/schemas/Household'
        member:
          $ref: '#/components/schemas/HouseholdMember'
    InvitePreview:
      type: object
      description: >-
        Read-only confirmation payload returned before redeem. `householdId` is deliberately omitted so a leaked URL
        does not expose it.
      required:
        - householdName
        - inviterDisplayName
        - role
        - permission
        - expiresAt
      properties:
        householdName:
          type: string
          maxLength: 80
        inviterDisplayName:
          type: string
          maxLength: 80
        role:
          $ref: '#/components/schemas/HouseholdRole'
        permission:
          type: string
          enum:
            - admin
            - member
        expiresAt:
          $ref: '#/components/schemas/IsoTimestamp'
    LeaderboardEntry:
      type: object
      required:
        - memberId
        - displayName
        - avatar
        - points
        - completions
        - rank
      properties:
        memberId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
        avatar:
          type: string
        points:
          type: integer
          minimum: 0
        completions:
          type: integer
          minimum: 0
        rank:
          type: integer
          minimum: 1
    HouseholdSummary:
      type: object
      required:
        - id
        - name
        - ownerUserId
        - rowVersion
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        ownerUserId:
          $ref: '#/components/schemas/Uuid'
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
    MyHouseholdEntry:
      type: object
      required:
        - household
        - memberId
        - role
        - permission
      properties:
        household:
          $ref: '#/components/schemas/HouseholdSummary'
        memberId:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/HouseholdRole'
        permission:
          $ref: '#/components/schemas/HouseholdPermission'
    SessionResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          $ref: '#/components/schemas/IsoTimestamp'
        user:
          $ref: '#/components/schemas/User'
    AppleNonceResponse:
      type: object
      properties:
        nonce:
          type: string
        expiresAt:
          type: string
      required:
        - nonce
        - expiresAt
      additionalProperties: false
    RefreshResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresAt
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          $ref: '#/components/schemas/IsoTimestamp'
    HouseholdCreateResponse:
      type: object
      required:
        - household
        - member
      properties:
        household:
          $ref: '#/components/schemas/Household'
        member:
          $ref: '#/components/schemas/HouseholdMember'
    CompletionCreateResponse:
      type: object
      required:
        - completion
        - task
      properties:
        completion:
          $ref: '#/components/schemas/TaskCompletion'
        task:
          $ref: '#/components/schemas/Task'
    SyncDelta:
      type: object
      required:
        - rowVersion
        - members
        - tasks
        - completions
        - hasMore
      properties:
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        household:
          $ref: '#/components/schemas/Household'
          description: Present iff the household row itself bumped past `since`.
        members:
          type: object
          required:
            - upserted
            - deleted
          properties:
            upserted:
              type: array
              items:
                $ref: '#/components/schemas/HouseholdMember'
            deleted:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
        tasks:
          type: object
          required:
            - upserted
            - deleted
          properties:
            upserted:
              type: array
              items:
                $ref: '#/components/schemas/Task'
            deleted:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
        completions:
          type: object
          required:
            - upserted
            - deleted
          properties:
            upserted:
              type: array
              items:
                $ref: '#/components/schemas/TaskCompletion'
            deleted:
              type: array
              items:
                $ref: '#/components/schemas/Uuid'
        hasMore:
          type: boolean
        nextSince:
          $ref: '#/components/schemas/RowVersion'
          description: Present iff `hasMore`. Pass back as `?since=`.
    SyncPushResult:
      type: object
      required:
        - clientId
        - status
      properties:
        clientId:
          type: string
        status:
          type: string
          enum:
            - applied
            - conflict
            - rejected
        serverId:
          $ref: '#/components/schemas/Uuid'
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        code:
          type: string
          description: Stable error code on conflict/rejected.
        current:
          description: On conflict, the fresh server-side entity (Task | HouseholdMember | Household | TaskCompletion).
    SyncPushResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncPushResult'
    GoogleSignInBody:
      type: object
      properties:
        idToken:
          type: string
          minLength: 20
        deviceLabel:
          type: string
          maxLength: 120
      required:
        - idToken
      additionalProperties: false
    AppleSignInBody:
      type: object
      properties:
        identityToken:
          type: string
          minLength: 20
        nonce:
          type: string
          minLength: 8
        deviceLabel:
          type: string
          maxLength: 120
      required:
        - identityToken
        - nonce
      additionalProperties: false
    RefreshBody:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 20
      required:
        - refreshToken
      additionalProperties: false
    PatchMeBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatar:
          type: string
          maxLength: 16
      additionalProperties: false
    CreateHouseholdBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - name
      additionalProperties: false
    RenameHouseholdBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    TransferOwnershipBody:
      type: object
      properties:
        toMemberId:
          type: string
      required:
        - toMemberId
      additionalProperties: false
    CreateMemberBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatar:
          type: string
          maxLength: 16
        role:
          type: string
          enum:
            - adult
            - child
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
      required:
        - displayName
        - avatar
        - role
      additionalProperties: false
    PatchMemberBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatar:
          type: string
          maxLength: 16
        role:
          type: string
          enum:
            - adult
            - child
        permission:
          type: string
          enum:
            - owner
            - admin
            - member
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
      additionalProperties: false
    CreateInviteBody:
      type: object
      properties:
        role:
          type: string
          enum:
            - adult
            - child
        permission:
          type: string
          enum:
            - admin
            - member
        maxUses:
          type: integer
          exclusiveMinimum: true
          minimum: 0
          maximum: 100
        expiresInHours:
          type: integer
          exclusiveMinimum: true
          minimum: 0
          maximum: 720
        invitedEmail:
          type: string
          format: email
          maxLength: 254
      required:
        - role
        - permission
      additionalProperties: false
    RedeemInviteBody:
      type: object
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          pattern: ^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{8}$
      required:
        - code
      additionalProperties: false
    CreateTaskBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        icon:
          type: string
          maxLength: 16
        notes:
          type: string
          maxLength: 1000
          nullable: true
        audience:
          type: string
          enum:
            - adults
            - children
            - everyone
        points:
          type: integer
          minimum: 0
          maximum: 1000000
        recurrence:
          type: object
          properties:
            preset:
              type: string
              enum:
                - hourly
                - daily
                - weekly
                - monthly
                - custom
            unit:
              type: string
              enum:
                - hours
                - days
                - weeks
                - months
            interval:
              type: integer
              exclusiveMinimum: true
              minimum: 0
              maximum: 10000
          required:
            - preset
            - unit
            - interval
          additionalProperties: false
        nextDueAt:
          type: string
          format: date-time
      required:
        - title
        - icon
        - audience
        - points
        - recurrence
      additionalProperties: false
    PatchTaskBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        icon:
          type: string
          maxLength: 16
        notes:
          type: string
          maxLength: 1000
          nullable: true
        audience:
          type: string
          enum:
            - adults
            - children
            - everyone
        points:
          type: integer
          minimum: 0
          maximum: 1000000
        recurrence:
          type: object
          properties:
            preset:
              type: string
              enum:
                - hourly
                - daily
                - weekly
                - monthly
                - custom
            unit:
              type: string
              enum:
                - hours
                - days
                - weeks
                - months
            interval:
              type: integer
              exclusiveMinimum: true
              minimum: 0
              maximum: 10000
          required:
            - preset
            - unit
            - interval
          additionalProperties: false
        nextDueAt:
          type: string
          format: date-time
      additionalProperties: false
    CreateCompletionBody:
      type: object
      properties:
        memberId:
          type: string
        completedAt:
          type: string
          format: date-time
      required:
        - memberId
      additionalProperties: false
    SyncPushBody:
      type: object
      properties:
        operations:
          type: array
          items:
            anyOf:
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - task.create
                  payload:
                    type: object
                    properties:
                      title:
                        type: string
                        minLength: 1
                        maxLength: 120
                      icon:
                        type: string
                        minLength: 1
                        maxLength: 16
                      notes:
                        type: string
                        maxLength: 1000
                        nullable: true
                      audience:
                        type: string
                        enum:
                          - adults
                          - children
                          - everyone
                      points:
                        type: integer
                        minimum: 0
                        maximum: 1000000
                      recurrence:
                        type: object
                        properties:
                          preset:
                            type: string
                            enum:
                              - hourly
                              - daily
                              - weekly
                              - monthly
                              - custom
                          unit:
                            type: string
                            enum:
                              - hours
                              - days
                              - weeks
                              - months
                          interval:
                            type: integer
                            exclusiveMinimum: true
                            minimum: 0
                            maximum: 10000
                        required:
                          - preset
                          - unit
                          - interval
                        additionalProperties: false
                      nextDueAt:
                        type: string
                        format: date-time
                    required:
                      - title
                      - icon
                      - audience
                      - points
                      - recurrence
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: >-
                  Insert a task. Caller must hold `admin` permission. When `nextDueAt` is omitted, the server defaults
                  to the operation's effective time (same as `POST /tasks`).
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - task.update
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                      patch:
                        type: object
                        properties:
                          title:
                            type: string
                            minLength: 1
                            maxLength: 120
                          icon:
                            type: string
                            minLength: 1
                            maxLength: 16
                          notes:
                            type: string
                            maxLength: 1000
                            nullable: true
                          audience:
                            type: string
                            enum:
                              - adults
                              - children
                              - everyone
                          points:
                            type: integer
                            minimum: 0
                            maximum: 1000000
                          recurrence:
                            type: object
                            properties:
                              preset:
                                type: string
                                enum:
                                  - hourly
                                  - daily
                                  - weekly
                                  - monthly
                                  - custom
                              unit:
                                type: string
                                enum:
                                  - hours
                                  - days
                                  - weeks
                                  - months
                              interval:
                                type: integer
                                exclusiveMinimum: true
                                minimum: 0
                                maximum: 10000
                            required:
                              - preset
                              - unit
                              - interval
                            additionalProperties: false
                          nextDueAt:
                            type: string
                            format: date-time
                        additionalProperties: false
                    required:
                      - id
                      - patch
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: Update a task with optimistic concurrency via `ifMatchRowVersion`. Caller must hold `admin`.
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - task.delete
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: Soft-delete a task and emit a tombstone. Caller must hold `admin`.
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - completion.create
                  payload:
                    type: object
                    properties:
                      taskId:
                        type: string
                      memberId:
                        type: string
                      completedAt:
                        type: string
                        format: date-time
                    required:
                      - taskId
                      - memberId
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: >-
                  Append a completion (never conflicts; advances `task.next_due_at`). `member` may record their own;
                  `admin` required to record on behalf of another member.
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - completion.delete
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: >-
                  Hard-delete a completion. Recomputes the affected task's `next_due_at` using the same algorithm as
                  `DELETE /completions/{completionId}` (most-recent surviving completion `+ recurrence`, or
                  `task.created_at + recurrence` if none). Caller must hold `admin`.
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - member.create
                  payload:
                    type: object
                    properties:
                      displayName:
                        type: string
                        minLength: 1
                        maxLength: 80
                      avatar:
                        type: string
                        minLength: 1
                        maxLength: 16
                      role:
                        type: string
                        enum:
                          - adult
                          - child
                      color:
                        type: string
                        pattern: ^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
                    required:
                      - displayName
                      - avatar
                      - role
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: Insert a standalone (non-account-backed) member. Caller must hold `admin`.
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - member.update
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                      patch:
                        type: object
                        properties:
                          displayName:
                            type: string
                            minLength: 1
                            maxLength: 80
                          avatar:
                            type: string
                            minLength: 1
                            maxLength: 16
                          role:
                            type: string
                            enum:
                              - adult
                              - child
                          permission:
                            type: string
                            enum:
                              - owner
                              - admin
                              - member
                          color:
                            type: string
                            pattern: ^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
                        additionalProperties: false
                    required:
                      - id
                      - patch
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: >-
                  Update a member with optimistic concurrency via `ifMatchRowVersion`. `admin` required; `permission`
                  changes additionally require `owner`.
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                      - member.delete
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                    additionalProperties: false
                  clientId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  ifMatchRowVersion:
                    type: integer
                    minimum: 0
                  ifMatchTaskRowVersion:
                    type: integer
                    minimum: 0
                required:
                  - kind
                  - payload
                  - clientId
                additionalProperties: false
                description: Soft-remove a member. Caller must hold `admin`. Owner cannot be removed; transfer first.
          minItems: 1
          maxItems: 500
      required:
        - operations
      additionalProperties: false
paths:
  /healthz:
