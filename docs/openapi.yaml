  /v1/households/{householdId}/sync:
    get:
      summary: Pull a delta of upserts + tombstones since `?since=<rowVersion>`. Paginated by 1MB byte budget.
      tags:
        - sync
      parameters:
        - name: householdId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: since
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDelta'
        '401':
          description: Authentication required or token invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — auth ok, permission insufficient.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
        - bearerAuth: []
      x-required-household-permission: member
      operationId: getHouseholdsByHouseholdIdSync
    post:
      summary: Push a batched array of operations. Per-item ack/conflict/rejected. Server-wins for non-completion conflicts.
      description: >-
        The route-level permission floor is `member`, but each operation `kind` re-checks permission inside the handler:


        | `kind` | Required permission |

        | --- | --- |

        | `completion.create` | `member` (admin if `memberId !== self`) |

        | `completion.delete` | `admin` |

        | `task.create` / `task.update` / `task.delete` | `admin` |

        | `member.create` / `member.update` / `member.delete` | `admin` (`permission` change requires `owner`) |


        A single rejected op does not fail the whole push; it surfaces in `results[i]` as `status: rejected` (or
        `conflict`) with a stable `code`. See per-variant descriptions on `SyncPushBody.operations.items`.
      tags:
        - sync
      parameters:
        - name: householdId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required or token invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden — auth ok, permission insufficient.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushBody'
      security:
        - bearerAuth: []
      x-required-household-permission: member
      operationId: postHouseholdsByHouseholdIdSync
